# rf-sim 5G SA network and one soft UE whose Pod also runs the CARLA camera client.
# Replace <cluster> and <org> in the client image with your kubeconfig cluster name.
# The client reaches CARLA over the Pod network and sends its frames through oaitun_ue1,
# so only the UE -> YOLO hop crosses the 5G network.
apiVersion: athena.trirematics.io/v1
kind: Network
metadata:
  name: carla-net
  namespace: trirematics
spec:
  slices:
  - plmn: '00102'
    dnn: internet
    network-mode: IPv4
    service-type: 1
    differentiator: 0
    ipv4-range: 12.2.1.0/24
    ipv6-range: 2001:db8:2::/64
  access:
  - name: gnb
    stack: 5g-sa
    model: oai-ran/monolithic-gnb
    identity:
      an-id: 51
      tracking-area: 1
    annotations:
      extras.t9s.io/do-srs: periodic
    radio:
      device: rf-sim
      antenna:
        formation: 1x1
    cells:
    - band: n78
      arfcn: 641280
      bandwidth: 20MHz
      subcarrier-spacing: 30kHz
      tdd-config:
        period: 5000
        dl-slots: 7
        dl-symbols: 6
        ul-slots: 2
        ul-symbols: 4
    core-networks:
    - cn.carla-net
  core:
  - name: cn
    stack: 5g-sa
    model: oai-cn/minimal
    identity:
      region: 0
      cn-group: 4
      cn-id: 6
  dns:
    ipv4:
      default: 8.8.8.8
      secondary: 8.8.4.4
---
apiVersion: athena.trirematics.io/v1
kind: Terminal
metadata:
  name: car1
  namespace: trirematics
spec:
  vendor: oai
  stack: 5g-sa
  model: terminal/oai-ue
  preferred-access: gnb.carla-net
  target-cores:
  - cn.carla-net
  identity:
    imsi: '001020000000011'
    pin: '1234'
    key: '0xfec86ba6eb707ed08905757b1bb44b8f'
    opc: '0xc42449363bbad02b66d16bc975d77cc1'
    sqn: '0xff9bb4000001'
  slice:
    dnn: internet
    network-mode: IPv4
    service-type: 1
    differentiator: 0
  radio:
    device: rf-sim
    bands:
    - n78
    formation: 1x1
  readiness-check:
    method: ping
    target: google-ip
    interface-name: oaitun_ue1
  applications:
    app-carla-client:
      image: registry.<cluster>.local:5000/telco-fabric/<org>/carla-client:latest
      env:
        CARLA_HOST: carla
        CARLA_PORT: '2000'
        YOLO_URL: http://yolo-edge:9000
        INTERFACE_5G: oaitun_ue1
        CAMERA: front
        FPS: '10'
        WIDTH: '800'
        HEIGHT: '450'
        NPC_VEHICLES: '30'
        NPC_WALKERS: '20'
        ACTOR_ID: car1
