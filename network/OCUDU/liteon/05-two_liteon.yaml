apiVersion: athena.trirematics.io/v1
kind: Network
metadata:
    name: ocudu-liteon
    namespace: trirematics
spec:
    slices:
        -   plmn: "00101"
            dnn: internet
            network-mode: IPv4
            service-type: 1
            differentiator: 0x000000
            ipv4-range: 12.1.1.0/24
            ipv6-range: 2001:db8:1::/64
    access:
        -   name: gnb-1
            stack: 5g-sa
            model: ocudu/monolithic-gnb-ru
            identity:
                an-id: 30
                tracking-area: 1
            radio:
                device: oran-7.2
                antenna:
                    formation: 4x4
            annotations:
                extras.t9s.io/ru-vendor: 'liteon'
            cells:
                -   band: n78
                    arfcn: 623328
                    bandwidth: 100MHz
                    subcarrier-spacing: 30kHz
                    tdd-config:
                        period: 2500
                        dl-slots: 3
                        dl-symbols: 6
                        ul-slots: 1
                        ul-symbols: 4
                          #controller: flexric.ocudu-liteon
            core-networks:
                - core.ocudu-liteon
        -   name: gnb-2
            stack: 5g-sa
            model: ocudu/monolithic-gnb-ru
            identity:
                an-id: 31
                tracking-area: 1
            radio:
                device: oran-7.2
                antenna:
                    formation: 4x4
            annotations:
                extras.t9s.io/ru-vendor: 'liteon'
            cells:
                -   band: n78
                    arfcn: 630048
                    bandwidth: 100MHz
                    subcarrier-spacing: 30kHz
                    tdd-config:
                        period: 2500
                        dl-slots: 3
                        dl-symbols: 6
                        ul-slots: 1
                        ul-symbols: 4
                          #controller: flexric.ocudu-liteon
            core-networks:
                - core.ocudu-liteon
    core:
        -   name: core
            stack: 5g-sa
            model: open5gs/5gc
            profiles:
                - debug
            identity:
                region: 128
                cn-group: 4
                cn-id: 5
    dns:
        ipv4:
            default: 8.8.8.8
            secondary: 8.8.4.4

#--- Add a UE with Terminals/terminal_quectel.yaml: preferred-access gnb-1.ocudu-liteon, target-cores core.ocudu-liteon ---#
