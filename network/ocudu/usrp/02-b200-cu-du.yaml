# OCUDU CU/DU split over the air, the DU on a USRP B200/B210, band n78, 40 MHz.
apiVersion: athena.trirematics.io/v1
kind: Network
metadata:
    name: ocudu-usrp
    namespace: trirematics
spec:
    slices:
        -   plmn: "00101"
            dnn: internet
            network-mode: IPv4
            service-type: 1
            differentiator: 0x000000
            ipv4-range: 12.1.1.0/24
            ipv6-range: 2001:db8:1::/64
    access:
        -   name: cu-du
            stack: 5g-sa
            model: ocudu/cu-du
            identity:
                an-id: 30
                tracking-area: 1
            radio:
                device: uhd-b200
            cells:
                -   band: n78
                    arfcn: 641280
                    bandwidth: 40MHz
                    subcarrier-spacing: 30kHz
                    tdd-config:
                        period: 5000
                        dl-slots: 7
                        dl-symbols: 6
                        ul-slots: 2
                        ul-symbols: 4
            core-networks:
                - core.ocudu-usrp
    core:
        -   name: core
            stack: 5g-sa
            model: oai-cn/minimal
            identity:
                region: 0
                cn-group: 4
                cn-id: 5
    dns:
        ipv4:
            default: 8.8.8.8
            secondary: 8.8.4.4

#--- Add a UE with terminals/quectel.yaml: preferred-access cu-du.ocudu-usrp, target-cores core.ocudu-usrp ---#
