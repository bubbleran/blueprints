apiVersion: athena.trirematics.io/v1
kind: Network
metadata:
    name: srsran-usrp
    namespace: trirematics
spec:
    slices:
        -   plmn: "00101"
            dnn: "internet"
            network-mode: "IPv4"
            service-type: 1
            differentiator: 0x000000
            ipv4-range: "12.1.1.0/24"
            ipv6-range: "2001:db8:1::/64"
    access:
        -   name: gnb
            stack: 5g-sa
            model: srs/monolithic-gnb
            identity:
                an-id: 50
            radio:
                device: uhd-b200
            cells:
                -   band: n78
                    arfcn: 641280
                    bandwidth: 40MHz
                    subcarrier-spacing: 30kHz
                    tdd-config:
                        period: 5000
                        dl-slots: 7
                        dl-symbols: 6
                        ul-slots: 2
                        ul-symbols: 4
            controller: flexric.srsran-usrp
            core-networks:
                - core.srsran-usrp
    core:
        -   name: core
            stack: 5g-sa
            model: oai-cn/minimal
            identity:
                region: 0
                cn-group: 4
                cn-id: 5
    dns:
        ipv4:
            default: 8.8.8.8
            secondary: 8.8.4.4
    edge:
        -   name: flexric
            stack: 5g-sa
            model: mosaic5g/flexric

#--- Add a UE with terminals/quectel.yaml: preferred-access gnb.srsran-usrp, target-cores core.srsran-usrp ---#
