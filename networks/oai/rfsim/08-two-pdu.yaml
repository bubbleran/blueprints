# OAI gNB and an OAI soft UE with two PDU sessions over the RF simulator:
# internet (SST 1) and iot (SST 2, SD 0x000001). The readiness check covers the default internet session.
apiVersion: athena.trirematics.io/v1
kind: Network
metadata:
    name: oai-rfsim
    namespace: trirematics
spec:
    slices:
        -   plmn: "00101"
            dnn: internet
            network-mode: IPv4
            service-type: 1
            differentiator: 0x000000
            ipv4-range: 12.1.1.0/24
            ipv6-range: 2001:db8:1::/64
        -   plmn: "00101"
            dnn: iot
            network-mode: IPv4
            service-type: 2
            differentiator: 0x000001
            ipv4-range: 12.1.2.0/24
            ipv6-range: 2001:db8:2::/64
    access:
        -   name: gnb
            stack: 5g-sa
            model: oai-ran/monolithic-gnb
            identity:
                an-id: 30
                tracking-area: 1
            radio:
                device: rf-sim
            cells:
                -   band: n78
                    arfcn: 621312
                    bandwidth: 40MHz
                    subcarrier-spacing: 30kHz
                    tdd-config:
                        period: 5000
                        dl-slots: 7
                        dl-symbols: 6
                        ul-slots: 2
                        ul-symbols: 4
            core-networks:
                - core.oai-rfsim
    core:
        -   name: core
            stack: 5g-sa
            model: oai-cn/minimal
            identity:
                region: 0
                cn-group: 4
                cn-id: 5
    dns:
        ipv4:
            default: 8.8.8.8
            secondary: 8.8.4.4
---
apiVersion: athena.trirematics.io/v1
kind: Terminal
metadata:
    name: ue1
    namespace: trirematics
    annotations:
        extras.t9s.io/pdu-sessions: "iot:2:0x000001"
spec:
    vendor: oai
    stack: 5g-sa
    model: terminal/oai-ue
    preferred-access: gnb.oai-rfsim
    target-cores:
        - core.oai-rfsim
    identity:
        imsi: "001010000000001"
        pin: "1234"
        opc: "0xc42449363bbad02b66d16bc975d77cc1"
        key: "0xfec86ba6eb707ed08905757b1bb44b8f"
        sqn: "0xff9bb4000001"
    slice:
        dnn: internet
        network-mode: IPv4
        service-type: 1
        differentiator: 0x000000
    radio:
        device: rf-sim
        formation: "1x1"
        bands:
            - n78
    # the Terminal is ready once every UE pings the target from its own tunnel (oaitun_ue<N>)
    readiness-check:
        method: ping
        target: gateway # UPF of the slice of each UE

#--- Add a UE the cluster does not run with terminals/external.yaml: preferred-access gnb.oai-rfsim, target-cores core.oai-rfsim ---#
