apiVersion: athena.trirematics.io/v1
kind: Network
metadata:
    name: ocudu-liteon
    namespace: trirematics
spec:
    slices:
        -   plmn: "00101"
            dnn: internet
            network-mode: IPv4
            service-type: 1
            differentiator: 0x000000
            ipv4-range: 12.1.1.0/24
            ipv6-range: 2001:db8:1::/64
    access:
        -   name: cu-du
            stack: 5g-sa
            model: ocudu/cu-du-ru
            identity:
                an-id: 30
                tracking-area: 1
            radio:
                device: oran-7.2
                antenna:
                    formation: 4x4
            annotations:
                extras.t9s.io/ru-vendor: 'liteon'
            cells:
                -   band: n78
                    arfcn: 623328  # Center Freq. at 3350 MHz
                    bandwidth: 100MHz
                    subcarrier-spacing: 30kHz
                    tdd-config:
                        period: 2500
                        dl-slots: 3
                        dl-symbols: 6
                        ul-slots: 1
                        ul-symbols: 4
            core-networks:
                - core.ocudu-liteon
            controller: flexric.ocudu-liteon
    edge:
        -   name: flexric
            stack: 5g-sa
            model: mosaic5g/flexric
        -   name: monitoring
            stack: 5g-sa
            model: mosaic5g/monitoring-c
            profiles:
                - kpm-sm
                - ocudu
                - database
            annotations:
                extras.t9s.io/scenario: 'liteon-cu-du' 
    core:
        -   name: core
            stack: 5g-sa
            model: open5gs/5gc
            profiles:
                - debug
            identity:
                region: 128
                cn-group: 4
                cn-id: 5
    dns:
        ipv4:
            default: 8.8.8.8
            secondary: 8.8.4.4

#--- Add a UE with terminals/quectel.yaml or terminals/external.yaml: preferred-access cu-du.ocudu-liteon, target-cores core.ocudu-liteon ---#
