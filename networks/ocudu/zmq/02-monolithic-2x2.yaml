# OCUDU gNB and an OAI soft UE linked over ZMQ, MIMO 2x2 40 MHz. No radio hardware is needed.
# The terminal manager computes the UE SSB position from the cell, so no SSB annotation is needed.
apiVersion: athena.trirematics.io/v1
kind: Network
metadata:
    name: ocudu-zmq
    namespace: trirematics
spec:
    slices:
        -   plmn: "00101"
            dnn: internet
            network-mode: IPv4
            service-type: 1
            differentiator: 0x000000
            ipv4-range: 12.1.1.0/24
            ipv6-range: 2001:db8:1::/64
    access:
        -   name: gnb
            stack: 5g-sa
            model: ocudu/monolithic-gnb
            identity:
                an-id: 30
                tracking-area: 1
            radio:
                device: zmq
                antenna:
                    formation: "2x2"
            annotations:
                # the gNB connects to the ZMQ UE by the DNS name of its Element: <model>.<terminal>.<terminal>.t9s.local
                terminals.roles.athena.t9s.io/oai-ue: "oai-ue-ocudu.ue1.ue1.t9s.local"
            cells:
                -   band: n78
                    arfcn: 632628
                    bandwidth: 40MHz
                    subcarrier-spacing: 30kHz
                    tdd-config:
                        period: 2500
                        dl-slots: 3
                        dl-symbols: 10
                        ul-slots: 1
                        ul-symbols: 2
            core-networks:
                - core.ocudu-zmq
    core:
        -   name: core
            stack: 5g-sa
            model: oai-cn/minimal
            identity:
                region: 0
                cn-group: 4
                cn-id: 5
    dns:
        ipv4:
            default: 8.8.8.8
            secondary: 8.8.4.4
---
apiVersion: athena.trirematics.io/v1
kind: Terminal
metadata:
    name: ue1
    namespace: trirematics
spec:
    vendor: oai
    stack: 5g-sa
    model: terminal/oai-ue-ocudu
    preferred-access: gnb.ocudu-zmq
    target-cores:
        - core.ocudu-zmq
    identity:
        imsi: "001010000000001"
        pin: "1234"
        opc: "0xc42449363bbad02b66d16bc975d77cc1"
        key: "0xfec86ba6eb707ed08905757b1bb44b8f"
        sqn: "0xff9bb4000001"
    slice:
        dnn: internet
        network-mode: IPv4
        service-type: 1
        differentiator: 0x000000
    radio:
        device: zmq
        formation: "2x2"
        bands:
            - n78
    # the Terminal is ready once every UE pings the target from its own tunnel (oaitun_ue<N>)
    readiness-check:
        method: ping
        target: gateway # UPF of the slice of each UE

#--- Add a UE the cluster does not run with terminals/external.yaml: preferred-access gnb.ocudu-zmq, target-cores core.ocudu-zmq ---#
