# Quectel modem (COTS UE) for the over-the-air blueprints: USRP, Benetel, Liteon, LiteON AIO and Amarisoft.
# Applies as is to networks/oai/usrp/01-b200.yaml (network oai-usrp). For another blueprint, replace
# oai-usrp by its network name (metadata.name), and gnb by cu-du for a CU/DU blueprint.
# Set the identity to the SIM card in the modem.
apiVersion: athena.trirematics.io/v1
kind: Terminal
metadata:
    name: quectel
    namespace: trirematics
spec:
    vendor: oai # amr for the Amarisoft blueprints
    stack: 5g-sa
    model: terminal/quectel
    preferred-access: gnb.oai-usrp # <access>.<network>
    target-cores:
        - core.oai-usrp # core.<network>
    identity:
        imsi: "001010000000001" # SIM card IMSI
        pin: "1234" # SIM card PIN
        opc: "0xc42449363bbad02b66d16bc975d77cc1" # SIM card OPC
        key: "0xfec86ba6eb707ed08905757b1bb44b8f" # SIM card key
        sqn: "0xff9bb4000001" # SIM card SQN
    slice:
        dnn: internet
        network-mode: IPv4
        service-type: 1
        differentiator: 0x000000
    radio:
        bands:
            - n78 # band of the network cell; list several bands for inter-frequency handover
    readiness-check:
        method: ping
        target: google-ip
